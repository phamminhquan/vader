<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go WebAssembly Interface</title>
    <style>
        /* Basic reset and structural layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0d1117; /* Dark background */
            color: #c9d1d9; /* Off-white text */
        }

        /* Top container containing the Left and Right textboxes */
        .top-container {
            display: flex;
            flex: 1; 
            min-height: 0; 
        }

        /* Individual column styling */
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        .column:first-child {
            border-right: 1px solid #30363d; /* Dark border separator */
        }

        /* Bottom log section styling */
        .bottom-log {
            height: 200px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            border-top: 2px solid #30363d;
            background-color: #161b22; /* Slightly darker panel look */
        }

        /* Header label styles */
        label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e; /* Muted gray for labels */
        }

        /* Unified textarea styles for dark mode */
        textarea {
            width: 100%;
            flex: 1;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none; 
            outline: none;
            background-color: #161b22; /* Dark textarea fill */
            color: #e6edf3; /* Crisp bright text for readability */
        }
        textarea:focus {
            border-color: #58a6ff; /* Neon blue focus ring */
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        /* Unique styling for read-only boxes */
        textarea[readonly] {
            background-color: #0d1117; /* Solid dark background */
            color: #8b949e; /* Slightly dimmer text for read-only status */
            cursor: not-allowed;
        }
        
        /* Specific styling for the log box terminal look */
        #logBox {
            background-color: #010409; /* Deep terminal black */
            color: #7ee787; /* Classic console green text */
            border-color: #30363d;
        }
    </style>
    
    <!-- 1. Include Go's WebAssembly execution bridge -->
    <script src="wasm_exec.js"></script>
</head>
<body>

    <div class="top-container">
        <div class="column">
            <label for="inputBox">Input Editor (Editable)</label>
            <textarea id="inputBox" disabled placeholder="Loading WebAssembly backend..."></textarea>
        </div>
        <div class="column">
            <label for="outputBox">Generated RTL (Read-Only)</label>
            <textarea id="outputBox" readonly placeholder="Waiting for Wasm execution..."></textarea>
        </div>
    </div>

    <div class="bottom-log">
        <label for="logBox">Execution Logs (Read-Only)</label>
        <textarea id="logBox" readonly></textarea>
    </div>

    <script>
        const inputBox = document.getElementById('inputBox');
        const outputBox = document.getElementById('outputBox');
        const logBox = document.getElementById('logBox');

        function logMessage(message) {
            logBox.value = `${message}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 2. Initialize and load Go WebAssembly
        logMessage("Initializing WebAssembly runtime...");
        const go = new Go();
        
        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
            .then((result) => {
                go.run(result.instance); // Start the Go background channel
                logMessage("SUCCESS: Go WebAssembly loaded and ready.");
                inputBox.disabled = false; // Enable typing now that backend is live
                inputBox.placeholder = "Type or paste your TOML here...";
            })
            .catch((err) => {
                logMessage(`ERROR: Failed to load WebAssembly: ${err}`);
            });

        // 3. Live Real-Time Event Listener
        inputBox.addEventListener('input', (e) => {
            const text = e.target.value;

            // Ensure the Go function is mounted before calling it
            if (typeof goProcessText === 'function') {
                try {
                    // Call the Go function directly from JavaScript
                    const response = goProcessText(text);
                    outputBox.value = response.result;
                    logMessage(`${response.log}`);
                } catch (err) {
                    logMessage(`Runtime execution error: ${err}`);
                }
            }
        });
    </script>
</body>
</html>
