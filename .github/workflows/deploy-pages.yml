name: Deploy GitHub Pages

on:
  push:
    branches: [ "main" ] # Triggers when you push to main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configures the GitHub Pages environment metadata
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Uploads your specific 'web-demo' folder as the page artifact
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web-demo' 

      # Deploys the uploaded artifact to the live web server
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

