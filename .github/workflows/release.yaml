name: Go Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow only when you push a tag starting with v (e.g., v1.0.0)

permissions:
  contents: write # Crucial: Allows GitHub Actions to create the release and upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for GoReleaser to generate a proper changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Replace with your required Go version
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2' # Uses the latest v2 version of GoReleaser
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub

